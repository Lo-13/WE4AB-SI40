<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détail salle - GamingRooms</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">

<header class="bg-gray-900 border-b border-purple-900 px-8 py-4 flex justify-between items-center">
    <a href="main.html" class="text-purple-400 text-xl font-semibold">🎮 GamingRooms</a>
    <nav class="flex gap-4">
        <a href="rooms.html" class="text-gray-400 hover:text-white transition">Salles</a>
        <a href="signin.html" class="border border-purple-600 text-purple-400 px-4 py-2 rounded-lg hover:bg-purple-600 hover:text-white transition text-sm">Se connecter</a>
        <a href="signup.html" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 transition text-sm">S'inscrire</a>
    </nav>
</header>

<main class="max-w-3xl mx-auto px-4 py-12">
    <a href="rooms.html" class="text-gray-500 hover:text-white text-sm mb-6 inline-block">← Retour aux salles</a>

    <div class="bg-gray-900 rounded-2xl p-8 border border-gray-800">
        <h2 class="text-3xl font-bold mb-2">Salle Alpha</h2>
        <p class="text-gray-400 mb-6">Salle cosy avec 2 TV 4K, canapés et PS5 dernière génération.</p>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-gray-800 rounded-xl p-4">
                <p class="text-gray-500 text-sm">Capacité</p>
                <p class="text-white font-semibold">6 joueurs max</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-4">
                <p class="text-gray-500 text-sm">Tarif</p>
                <p class="text-purple-400 font-semibold">15€ / heure</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-4">
                <p class="text-gray-500 text-sm">Plateforme</p>
                <p class="text-white font-semibold">PS5</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-4">
                <p class="text-gray-500 text-sm">Jeux disponibles</p>
                <p class="text-white font-semibold">FIFA 25, COD, GTA V...</p>
            </div>
        </div>

        <a href="reservation.html" class="block text-center bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl transition font-semibold">
            Réserver cette salle
        </a>
    </div>
</main>

</body>
</html>
